<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nadia & Óscar · Nuestra boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- SOBRE DE INICIO -->
<div id="stage">
  <div class="env" id="env">
    <div class="body"></div>

    <!-- Solapa: cara de afuera + cara de adentro (forro con rombos) -->
    <div class="flap">
      <svg class="cara" viewBox="0 0 400 242" preserveAspectRatio="none">
        <defs><linearGradient id="gSolapa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e5d9"/><stop offset="1" stop-color="#cdd2c2"/></linearGradient></defs>
        <polygon points="0,0 400,0 400,76 200,242 0,76" fill="url(#gSolapa)"/>
        <path d="M14 72L200 222L386 72" fill="none" stroke="#b8975a" stroke-opacity=".6" stroke-width="1" stroke-dasharray="4 4"/>
        <path d="M0 76L200 242L400 76" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.4"/>
      </svg>
      <svg class="cara atras" viewBox="0 0 400 242" preserveAspectRatio="none">
        <defs><pattern id="rombos" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 7H14M7 0V14" stroke="#b8975a" stroke-opacity=".45" stroke-width=".7"/></pattern></defs>
        <polygon points="0,0 400,0 400,76 200,242 0,76" fill="#c3cbb9"/>
        <polygon points="0,0 400,0 400,76 200,242 0,76" fill="url(#rombos)"/>
      </svg>
    </div>

    <div class="letter">
      <p class="script" id="sobre-titulo"></p>
      <img id="sobre-foto" alt="Nadia y Óscar" onerror="this.style.visibility='hidden'">
    </div>

    <!-- Frente: 3 piezas con dobleces -->
    <div class="front">
      <svg viewBox="0 0 400 331" preserveAspectRatio="none">
        <defs>
          <linearGradient id="gIzq" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0e6"/><stop offset="1" stop-color="#dfe2d4"/></linearGradient>
          <linearGradient id="gDer" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#dcdfd0"/><stop offset="1" stop-color="#cfd4c4"/></linearGradient>
          <linearGradient id="gAbajo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9ebe0"/><stop offset="1" stop-color="#d5d9ca"/></linearGradient>
        </defs>
        <polygon points="0,40 200,205 0,331" fill="url(#gIzq)"/>
        <polygon points="400,40 200,205 400,331" fill="url(#gDer)"/>
        <polygon points="0,331 200,205 400,331" fill="url(#gAbajo)"/>
        <g fill="none" stroke-linecap="round">
          <path d="M0 41.2L200 206.2L400 41.2M0 332.2L200 206.2L400 332.2" stroke="#fff" stroke-opacity=".75" stroke-width="1.4"/>
          <path d="M0 40L200 205L400 40M0 331L200 205L400 331" stroke="#a3ab94" stroke-opacity=".8" stroke-width="1"/>
        </g>
      </svg>
    </div>

    <button class="seal-btn" id="bow" aria-label="Abrir invitación">
      <img id="sobre-sello" alt="Sello" onerror="this.style.visibility='hidden'">
    </button>
    <p class="env-hint" id="sobre-texto"></p>
  </div>
</div>

<main id="app"></main>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
