<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nadia & Óscar · Nuestra boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- SOBRE DE INICIO -->
<div id="stage">
  <div class="env" id="env">
    <div class="back"></div>
    <div class="letter"><div><div class="script" id="sobre-nombres"></div></div></div>
    <div class="front"></div><div class="flap"></div>
    <div class="band v"></div><div class="band h"></div>
    <button class="bow" id="bow" aria-label="Abrir invitación">
      <svg viewBox="0 0 100 100" width="92" height="92">
        <path d="M50 50C30 20 6 24 10 46c3 18 30 12 40 4z" fill="#b3c9b8"/><path d="M50 50C70 20 94 24 90 46c-3 18-30 12-40 4z" fill="#b3c9b8"/>
        <path d="M50 52L32 90l12-8 6 10 4-40z" fill="#8fab96"/><path d="M50 52L68 90l-12-8-6 10-4-40z" fill="#7f9c87"/>
        <circle cx="50" cy="50" r="10" fill="#d9a441"/>
      </svg>
    </button>
  </div>
  <p class="hint">Toca el lazo para abrir la invitación</p>
</div>

<main id="app"></main>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
